<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../style.css">
  <title>Math Room</title>
</head>
<body>
    <div class="scroll-progress"></div>
  <header class="header">
    <img src="/learningmath/logo.png" alt="mathroom logo" class="logo"/>
    <nav class="nav">
      <a href="../about.html" class="nav-link">About me</a>
      <a href="../index.html" class="nav-link">Main</a>
    </nav>
        <button id="theme-toggle"></button>
  </header>

<h1> Variables vs Constants</h1>
<div class="lesson-content">
<section id="part-5" class="lesson-part">

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Feature</th>
          <th>Variable</th>
          <th>Constant</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><strong>Value</strong></td>
          <td>Changes / Unknown</td>
          <td>Fixed / Known</td>
        </tr>
        <tr>
          <td><strong>Symbol</strong></td>
          <td>Letters (x, y, a)</td>
          <td>Plain numbers (4, -9, 3.14)</td>
        </tr>
        <tr>
          <td><strong>Example in Real Life</strong></td>
          <td>Outside temperature</td>
          <td>Freezing point of water (0&deg;C)</td>
        </tr>
        <tr>
          <td><strong>In 8x + 3</strong></td>
          <td>x</td>
          <td>3</td>
        </tr>
      </tbody>
    </table>
  </div>
</section>
</div>


<script>
const toggleBtn = document.getElementById('theme-toggle');


if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark-theme');
  toggleBtn.textContent = '☀️'; 
} else {
  toggleBtn.textContent = '🌙'; 
}


toggleBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark-theme');
  
  if (document.body.classList.contains('dark-theme')) {
    toggleBtn.textContent = '☀️';
    localStorage.setItem('theme', 'dark'); 
  } else {
    toggleBtn.textContent = '🌙';
    localStorage.setItem('theme', 'light'); 
  }
});


</script>
</body>

<div class="lesson-navigation">
  <a id="prev-btn" class="nav-btn">← Previous Part</a>
  <a id="next-btn" class="nav-btn">Next Part →</a>
</div>

<script>

const courseMap = [

  "lesson1/part1.html", "lesson1/part2.html", "lesson1/part3.html", 
  "lesson1/part4.html", "lesson1/part5.html", "lesson1/part6.html",

  "lesson2/part1.html", "lesson2/part2.html", "lesson2/part3.html", 
  "lesson2/part4.html", "lesson2/part5.html", "lesson2/part6.html", 
  "lesson2/part7.html", "lesson2/part8.html",

  "lesson3/part1.html", "lesson3/part2.html", "lesson3/part3.html", 
  "lesson3/part4.html", "lesson3/part5.html", "lesson3/part6.html", 
  "lesson3/part7.html", "lesson3/part8.html", "lesson3/part9.html",

  "lesson4/part1.html", "lesson4/part2.html", "lesson4/part3.html", 
  "lesson4/part4.html", "lesson4/part5.html", "lesson4/part6.html",

  "lesson5/part1.html", "lesson5/part2.html", "lesson5/part3.html", 
  "lesson5/part4.html", "lesson5/part5.html", "lesson5/part6.html"
];


const currentPath = window.location.pathname;
const currentIndex = courseMap.findIndex(path => currentPath.endsWith(path));

const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

if (currentIndex !== -1) {

  if (currentIndex > 0) {
    prevBtn.href = "../" + courseMap[currentIndex - 1];
  } else {
    prevBtn.classList.add('disabled');
    prevBtn.removeAttribute('href');
  }


  if (currentIndex < courseMap.length - 1) {
    nextBtn.href = "../" + courseMap[currentIndex + 1];
  } else {
    nextBtn.classList.add('disabled');
    nextBtn.removeAttribute('href');
  }
}
</script>
</html>
