<h3>Example 1</h3>

<p><strong>2/7</strong></p>

<p>Compare the numerator and denominator:</p>

<p><strong>2 &lt; 7</strong></p>

<p>
    Therefore, <strong>2/7 is a proper fraction</strong>.
</p>

<h3>Example 2</h3>

<p><strong>9/4</strong></p>

<p><strong>9 &gt; 4</strong></p>

<p>
    Therefore, <strong>9/4 is an improper fraction</strong>.
</p>

<h3>Example 3</h3>

<p><strong>6/6</strong></p>

<p><strong>6 = 6</strong></p>

<p>
    Therefore, <strong>6/6 is an improper fraction</strong>.
</p>

<p><strong>6/6 = 1</strong></p>
  </div>

<script>
const toggleBtn = document.getElementById('theme-toggle');


if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark-theme');
  toggleBtn.textContent = '☀️'; 
} else {
  toggleBtn.textContent = '🌙'; 
}


toggleBtn.addEventListener('click', () => {
  document.body.classList.toggle('dark-theme');
  
  if (document.body.classList.contains('dark-theme')) {
    toggleBtn.textContent = '☀️';
    localStorage.setItem('theme', 'dark'); 
  } else {
    toggleBtn.textContent = '🌙';
    localStorage.setItem('theme', 'light'); 
  }
});


</script>
</body>

<script>

const currentPath = window.location.pathname;
const currentIndex = courseMap.findIndex(path => currentPath.endsWith(path));

const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

if (currentIndex !== -1) {

  if (currentIndex > 0) {
    prevBtn.href = "../" + courseMap[currentIndex - 1];

}
